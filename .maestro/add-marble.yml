# marble-jar — single happy-path E2E flow (integration only, no unit tests).
#
# Runs against the web export by default. The app is exported with
# `expo.experiments.baseUrl = "/marble-jar"`, so the exported files must sit in a
# `marble-jar/` directory under the serve root:
#   npx expo export --platform web --output-dir .expo/site/marble-jar
#   npx serve .expo/site --listen 8081
#   maestro test .maestro/*.yml
#
# Also works against the dev server (`npm run web`, which listens on 8081 and
# serves the same /marble-jar base path), so the same flow covers local dev and
# CI.
#
# Uses `url:` (not `appId:`) so Maestro drives the Chromium-based web driver.
# Web support is Beta/Chromium-only.
#
# testIDs used (owned by the app lane):
#   add-person-input   home: person name field
#   add-person-button  home: "Add" button
#   person-row         home: a person entry (opens /person/[id])
#   jar-count          home row count "0/20 · 0%" and person count "0 / 20 marbles · 0%"
#   marble-reason      person: reason field
#   add-marble         person: "+ Marble" button
#
# Every one of those testIDs is mirrored as `nativeID` in the app. On web
# react-native-web renders `testID` as `data-testid` and `nativeID` as the DOM
# `id`, and Maestro's web driver picks an element's identifier in this order:
# id -> aria-label -> name -> title -> for -> data-testid. Because the screens
# carry accessibilityLabels (aria-label), `data-testid` alone is never reached
# — `nativeID` is what makes `id:` resolve.
#
# Maestro's `text:` selector only reads a node's *direct* text children, so
# `id:` and `text:` can only be combined when both live on the same element
# (true for jar-count, false for person-row, whose label is nested).
#
# The count assertions below hard-code JAR_CAPACITY (lib/store.ts = 20); they must
# be bumped whenever the capacity changes.
#
# Persistence is localStorage on web, so a reload must keep state.
url: http://localhost:8081/marble-jar
name: Add a marble to a person and keep it after reload
---
- launchApp:
    clearState: true

# --- Add a person ------------------------------------------------------------
- assertVisible:
    id: add-person-input
- tapOn:
    id: add-person-input
- inputText: Maya
- hideKeyboard
- tapOn:
    id: add-person-button
- assertVisible:
    id: person-row
- assertVisible: Maya
- assertVisible:
    id: jar-count
    text: 0/20.*

# --- Open the person ---------------------------------------------------------
- tapOn:
    id: person-row
- assertVisible:
    id: jar-count
    text: 0\s/20\smarbles.*
- assertVisible:
    id: marble-reason

# --- Add a marble with a reason ---------------------------------------------
- tapOn:
    id: marble-reason
- inputText: remembered the small thing
- hideKeyboard
- tapOn:
    id: add-marble

# --- Count went 0 -> 1, reason is in the history -----------------------------
- assertVisible:
    id: jar-count
    text: 1\s/20\smarbles.*
- assertVisible: remembered the small thing

# --- Reload without clearing state: state must persist -----------------------
- launchApp:
    clearState: false
- runFlow:
    when:
      visible:
        id: person-row
    commands:
      - tapOn:
          id: person-row
- assertVisible:
    id: jar-count
    text: 1\s/20\smarbles.*
