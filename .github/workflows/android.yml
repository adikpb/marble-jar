# Android APK release — pure GitHub Actions, no EAS.
#
# EAS was removed (see docs/android-release.md). There is no Play Store
# submission: Android ships as a *release-signed* APK attached to a GitHub
# Release. iOS users use the web/PWA build from GitHub Pages.
#
# Flow (push to main, or manual):
#   prebuild  -> Continuous Native Generation writes android/ (gitignored,
#                never committed)
#   keystore  -> decode the release keystore from ANDROID_KEYSTORE_BASE64 into
#                android/app/release.keystore
#   signing   -> inject a `release` signingConfig into the generated
#                android/app/build.gradle
#   gradle    -> assembleRelease
#   release   -> upload app-release.apk to the GitHub Release for tag
#                v<version> where <version> is `expo.version` in app.json
#
# FOUR SECRETS: ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS,
# KEY_PASSWORD. The keystore is decoded on the runner, used to sign, and
# discarded — it never lands in a build output or artifact. Generate it once
# with keytool; back it up; never commit it. See docs/android-release.md.
# GITHUB_TOKEN is provided by default and needs no configuration; this
# workflow declares `contents: write` for the Release upload.
#
# Because the signing key is stable, users upgrade in place — download the new
# APK and install over the old one. The single exception is the one-time
# migration off the old debug-signed APK, which requires an uninstall (that
# deletes local app data). See docs/android-release.md.
#
# Versioning: there is no autoIncrement (that was EAS). `expo.version` in
# app.json becomes versionName, and `expo.android.versionCode` (default 1)
# becomes versionCode. Bump BOTH by hand before merging a release change —
# Android refuses to install an APK whose versionCode is not higher than the
# installed one. See docs/android-release.md.

name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  # React Native 0.86 / AGP compile against Java 17 bytecode.
  JAVA_VERSION: '17'
  # Ship arm64 + armv7 only: no x86 in sideloaded APKs worth the size.
  # Add x86_64 here if you install on an emulator.
  ANDROID_ARCHITECTURES: arm64-v8a,armeabi-v7a

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Do NOT reintroduce android-actions/setup-android here. Its default
      # package list still asks sdkmanager for the long-obsolete `tools`
      # package, which cmdline-tools 16 no longer serves, so the action fails
      # with "Warning: Failed to find package 'tools'" before the build even
      # starts. The ubuntu-latest image already ships a working cmdline-tools
      # 16.0 in $ANDROID_HOME, so provision the packages explicitly instead.
      #
      # Expo SDK 57 compiles against compileSdk/targetSdk 36 (see
      # applyDefaultAndroidSdkVersions in expo-modules-core's
      # ProjectConfiguration.kt). Everything else the build needs — the NDK,
      # CMake, and whatever build-tools revision AGP 8.12 picks — is fetched by
      # AGP itself through the android.builder.sdkDownload step below.
      - name: Setup Android SDK
        run: |
          set -euo pipefail

          # Prefer the versioned cmdline-tools, fall back to `latest`.
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          # Licenses are the ONLY place `yes |` is safe: sdkmanager keeps
          # reading stdin there, and any failure is non-fatal because AGP's
          # sdkDownload accepts already-accepted licenses anyway.
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true

          # NO `yes |` around --install. When the requested packages are
          # already present sdkmanager exits without reading stdin, so `yes`
          # takes SIGPIPE and — under `set -o pipefail` — the step fails with
          # exit 141 even though the install succeeded. That was a false
          # negative, not a real failure.
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-36"

          # Sanity check only: build-tools is NOT installed here. The runner
          # image already ships build-tools 35.0.0/36.0.0 and AGP fetches
          # anything genuinely missing via android.builder.sdkDownload, so a
          # hard failure here would only ever be a false negative again.
          ls "$ANDROID_HOME/build-tools"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail fast and loudly rather than 20 minutes into a gradle build with a
      # confusing "storeFile was missing" error.
      - name: Verify signing secrets are present
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required repository secret(s): ${missing[*]}"
            echo "See docs/android-release.md for the one-time keytool + secrets setup."
            exit 1
          fi
          echo "all 4 signing secrets are present"

      # Continuous Native Generation: android/ is generated here and is in
      # .gitignore. Native config lives in app.json (plugins, package name,
      # icons), so never edit or commit android/ by hand.
      - name: Prebuild Android (CNG)
        env:
          EXPO_NO_DOCTOR: '1'
        run: npx expo prebuild --platform android --clean --no-install

      # Let AGP pull the compileSdk/NDK/buildTools versions declared by the
      # Expo/RN plugins instead of hardcoding them here.
      - name: Allow AGP to download SDK components
        run: printf '\nandroid.builder.sdkDownload=true\n' >> android/gradle.properties

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          chmod 600 android/app/release.keystore
          # Sanity check: it must be a real keystore holding the expected alias.
          # Passwords come from the env so they never appear in the command line.
          keytool -list -keystore android/app/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      # android/ is generated, so the signing config has to be injected into
      # the generated build.gradle on every run. Expo's template ships
      # `signingConfigs { debug { ... } }` and a buildTypes.release that
      # points at signingConfigs.debug; add a release config and re-point it.
      #
      # Do NOT pattern-match `release {\n\s*signingConfig ...` here. On SDK 57
      # the template puts two `//` comment lines between `release {` and its
      # `signingConfig signingConfigs.debug` line, so that regex never matched
      # and the step died with "buildTypes.release was not pointing at
      # signingConfigs.debug". Instead, locate signingConfigs/buildTypes by
      # brace matching and re-point whichever `signingConfig` line the release
      # buildType actually has (or add one if it has none).
      - name: Inject release signingConfig
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const file = 'android/app/build.gradle';
          let g = fs.readFileSync(file, 'utf8');

          // Blank out `//` comments *in place* (same length) so brace counting
          // ignores them without shifting any index.
          const scan = () => g.replace(/\/\/[^\n]*/g, (m) => ' '.repeat(m.length));

          // Brace-match a block from the index of its opening `{`.
          function blockAt(openIdx, indent, name) {
            const s = scan();
            let depth = 0;
            for (let i = openIdx; i < s.length; i++) {
              if (s[i] === '{') depth++;
              else if (s[i] === '}' && --depth === 0) return { name, open: openIdx, close: i, indent };
            }
            throw new Error(`unbalanced braces: ${name} { has no matching }`);
          }

          // Find `<name> {` anchored at the start of a line, anywhere in the file.
          function findBlock(name) {
            const m = new RegExp('(^|\\n)([ \\t]*)\\b' + name + '\\s*\\{').exec(g);
            return m ? blockAt(m.index + m[0].length - 1, m[2], name) : null;
          }

          // Find a `<name> {` inside an already-located block.
          function findChild(parent, name) {
            const m = new RegExp('(^|\\n)([ \\t]*)\\b' + name + '\\s*\\{').exec(
              g.slice(parent.open + 1, parent.close),
            );
            if (!m) return null;
            const base = parent.open + 1 + m.index;
            return blockAt(base + m[0].length - 1, m[2], name);
          }

          // Indentation for a line inserted directly inside `block`.
          const innerIndent = (block) => {
            const m = /(?:^|\n)([ \t]+)\S/.exec(g.slice(block.open + 1, block.close));
            return m ? m[1] : block.indent + '    ';
          };

          // Offset of the first character after the line holding `block.open`.
          const firstInnerLine = (block) => {
            const nl = g.indexOf('\n', block.open);
            if (nl === -1) throw new Error(`${block.name} { has no closing line break`);
            const rest = g.slice(block.open + 1, nl);
            if (rest.trim() !== '') throw new Error(`unexpected text after ${block.name} { on the same line`);
            return nl + 1;
          };

          const signingConfigs = findBlock('signingConfigs');
          if (!signingConfigs) throw new Error(`no signingConfigs { block found in ${file}`);
          const buildTypes = findBlock('buildTypes');
          if (!buildTypes) throw new Error(`no buildTypes { block found in ${file}`);

          const releaseBuildType = findChild(buildTypes, 'release');
          if (!releaseBuildType) throw new Error(`no release buildType inside buildTypes { in ${file}`);

          // 1. Point buildTypes.release at signingConfigs.release — replace
          //    whatever signingConfig it currently has (debug, none, or an
          //    already-injected release), else insert the line.
          const current = /(^|\n)([ \t]*)signingConfig[^\n]*/.exec(
            g.slice(releaseBuildType.open + 1, releaseBuildType.close),
          );
          if (current) {
            const base = releaseBuildType.open + 1 + current.index;
            const from = base + current[1].length + current[2].length;
            g =
              g.slice(0, from) +
              'signingConfig signingConfigs.release' +
              g.slice(base + current[0].length);
            console.log('re-pointed buildTypes.release at signingConfigs.release');
          } else {
            const at = firstInnerLine(releaseBuildType);
            g =
              g.slice(0, at) +
              `${innerIndent(releaseBuildType)}signingConfig signingConfigs.release\n` +
              g.slice(at);
            console.log('added a signingConfig line to buildTypes.release');
          }

          // 2. Add the release signingConfig, reading secrets from the env so
          //    no credential is ever written into the generated build.gradle.
          //    Re-resolve the block: step 1 may have shifted offsets.
          const configs = findBlock('signingConfigs');
          if (findChild(configs, 'release')) {
            console.log('signingConfigs already declares a release block — not injecting again');
          } else {
            const i = innerIndent(configs);
            const blockText = [
              `${i}release {`,
              `${i}    storeFile file('release.keystore')`,
              `${i}    storePassword System.getenv('KEYSTORE_PASSWORD')`,
              `${i}    keyAlias System.getenv('KEY_ALIAS')`,
              `${i}    keyPassword System.getenv('KEY_PASSWORD')`,
              `${i}}`,
              '',
            ].join('\n');
            const at = firstInnerLine(configs);
            g = g.slice(0, at) + blockText + g.slice(at);
            console.log('release signingConfig injected');
          }

          fs.writeFileSync(file, g);
          NODE

      - name: Assemble release APK
        working-directory: android
        # Single line on purpose. A `\` line continuation inside a plain YAML
        # scalar is folded to `\ ` (backslash + space), so the shell passed
        # " -PreactNativeArchitectures=..." as one argument and gradle read it
        # as a task name. Keep the whole command on one line, unquoted.
        run: ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=${{ env.ANDROID_ARCHITECTURES }}

      - name: Locate and verify APK
        id: apk
        run: |
          set -euo pipefail
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          test -n "$apk"
          echo "name=$apk" >> "$GITHUB_OUTPUT"
          ls -lh "$apk"
          # Sanity check: readable archive + the expected application id.
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          "$aapt2" dump badging "$apk" | grep -E "^package:|application-label"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: marble-jar-apk
          path: ${{ steps.apk.outputs.name }}
          retention-days: 30
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.apk.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./app.json').expo.version")
          tag="v${version}"
          name=$(basename "$APK_PATH")

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "releasing into existing release $tag"
          else
            gh release create "$tag" --title "$tag" --generate-notes
          fi
          gh release upload "$tag" "$APK_PATH#${name}" --clobber
          echo "published ${name} -> https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"